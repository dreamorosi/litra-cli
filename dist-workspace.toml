[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["homebrew"]
targets = ["aarch64-apple-darwin"]
publish-jobs = ["homebrew"]
tap = "dreamorosi/homebrew-tap"
dispatch-releases = true
pr-run-mode = "upload"
github-build-setup = "../build-setup.yml"
# GitHub already provides source archives for each tag.
source-tarball = false

# Generated workflows must not be edited to update these pins.
# Change them here, run `dist generate`, and sync the checkout pin in CI
# and version-bump.yml. Dependabot ignores the generated action references.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
