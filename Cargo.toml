[package]
name = "litra"
version = "0.1.0"
edition = "2021"
description = "A small CLI for the Logitech Litra Glow"
license = "MIT"
authors = ["Andrea Amorosi <dreamorosi@gmail.com>"]
repository = "https://github.com/dreamorosi/litra-cli"
homepage = "https://github.com/dreamorosi/litra-cli"

[dependencies]
fs2 = "0.4"
hidapi = "2.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[profile.dist]
inherits = "release"
